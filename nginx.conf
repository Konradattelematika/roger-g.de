# nginx für den statischen Astro-Build (Roger G. Try Out Tour).
#
# - www.roger-g.de -> 301 auf den Apex (Canonical zeigt auf roger-g.de; Traefik/Coolify
#   liefert sonst beide Hosts mit 200 aus). Das Schema kommt von Traefik (X-Forwarded-Proto),
#   Ziel ist immer https.
# - Seiten liegen als pfad/index.html im Build; ohne eigene Config würde nginx /impressum
#   per absolutem 301 auf http:// schicken.
# - Sicherheits-Header: HSTS (ohne includeSubDomains, Subdomains unbekannt), nosniff, Framing-Schutz.
#   add_header wird in Locations mit eigenem add_header nicht vererbt -> Header dort wiederholt.

server {
    listen       80;
    server_name  www.roger-g.de;
    return 301 https://roger-g.de$request_uri;
}

server {
    listen       80 default_server;
    server_name  _;
    root         /usr/share/nginx/html;

    absolute_redirect off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml;
    gzip_min_length 512;
}
